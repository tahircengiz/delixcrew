# Deterministic checks only. The behaviour evals (claude plugin eval) call the model and cost money; they stay local.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: All tests (tests/*_tests.sh)
        # same command as docs/delix/delix.json test_command; -x logs one "+ bash tests/<file>" line per file
        shell: bash --noprofile --norc -x -eo pipefail {0}
        run: for t in tests/*_tests.sh; do bash "$t" || exit 1; done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Claude Code (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.309
      - name: Validate plugin
        run: claude plugin validate .
